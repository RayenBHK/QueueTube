<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QueueTube</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span></div>
        <div><p class="eyebrow">YOUR WATCHING CONTROL DESK</p><h1>Queue<span>Tube</span></h1></div>
        <div class="total" aria-label="Total queued"><strong id="total-count">0</strong><span>queued</span></div>
      </header>

      <button class="room-button" id="open-room" type="button">
        <span><small>OPEN THE</small><strong>Queue Room</strong></span>
        <span class="room-arrow" aria-hidden="true">→</span>
      </button>

      <section class="lanes" aria-label="Video queues">
        <article class="lane lane-short">
          <span class="lane-dot" aria-hidden="true"></span>
          <div><p class="lane-status">QUICK RUN</p><h2>Shorts</h2><small>One player · manual play</small></div>
          <strong class="lane-count" id="short-count">0</strong>
          <button data-open="short" type="button">Play <span aria-hidden="true">▶</span></button>
        </article>
        <article class="lane lane-video">
          <span class="lane-dot" aria-hidden="true"></span>
          <div><p class="lane-status">ZERO MEMORY</p><h2>Videos</h2><small>No page until selected</small></div>
          <strong class="lane-count" id="video-count">0</strong>
          <button data-open="video" type="button">Play <span aria-hidden="true">▶</span></button>
        </article>
      </section>

      <footer>
        <p id="status" role="status" aria-live="polite">Ctrl-click a YouTube pick to begin.</p>
        <p><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>Q</kbd></p>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
